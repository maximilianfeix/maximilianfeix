<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Maximilian Feix — backend, infrastructure, automation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6F9FC"/>
      <stop offset="60%" stop-color="#EDF3F8"/>
      <stop offset="100%" stop-color="#E3EDF6"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#B9CEDE" stroke-width="1" stroke-opacity="0.45"/>
    </pattern>
    <clipPath id="round">
      <rect x="0" y="0" width="1200" height="280" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
