    <rect width="1200" height="280" fill="url(#grid)"/>
    <rect x="0" y="278" width="1200" height="2" fill="url(#rule)"/>

    <text x="72" y="108" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-1.5" fill="#10243A">Maximilian Feix</text>
    <rect x="72" y="126" width="96" height="3" rx="1.5" fill="#0284C7"/>
    <text x="72" y="168" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Consolas, monospace" font-size="19" fill="#43647E">backend / infrastructure / automation</text>
    <text x="72" y="206" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Consolas, monospace" font-size="15" fill="#6B879E">building and keeping things online, from Germany</text>

