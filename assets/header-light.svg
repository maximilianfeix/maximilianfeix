        <circle cx="24" cy="21" r="5" fill="#10B981">
          <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
        </circle>
        <text x="46" y="26" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#43647E">api</text>
