<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Maximilian Feix — backend, infrastructure, automation. Building devprofile.dev, learning microservices, shipping proxy-scraper.">
  <style>
    .line, .chip, .fade { animation: fade .6s ease-out both; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .scan { animation: scan 6s linear infinite; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(1.8); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes scan { from { transform: translateX(-300px); } to { transform: translateX(1500px); } }
    @media (prefers-reduced-motion: reduce) { .line, .chip, .fade, .pulse, .cursor, .scan { animation: none; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1622"/><stop offset="1" stop-color="#0F2233"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#38BDF8" stop-opacity=".16"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/><stop offset=".5" stop-color="#38BDF8" stop-opacity=".9"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#16293B" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)" opacity=".55"/>
    <rect width="1200" height="320" fill="url(#glow)"/>
    <rect class="scan" y="317" width="300" height="3" fill="url(#beam)"/>
  </g>

  <g class="fade">
    <text x="64" y="84" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="3">BACKEND · INFRASTRUCTURE · AUTOMATION</text>
    <text x="62" y="148" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-1.5">Maximilian Feix</text>
    <rect x="64" y="166" width="72" height="4" rx="2" fill="#38BDF8"/>
    <text x="64" y="204" fill="#8BA3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19">building and keeping things online, from Germany</text>
  </g>
  <g class="chip" style="animation-delay:0.25s"><rect x="64" y="226" width="100" height="30" rx="15" fill="#132638" stroke="#24405A"/><text x="114" y="246" text-anchor="middle" fill="#8BA3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">TypeScript</text></g><g class="chip" style="animation-delay:0.33s"><rect x="174.0" y="226" width="75" height="30" rx="15" fill="#132638" stroke="#24405A"/><text x="212" y="246" text-anchor="middle" fill="#8BA3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">Node.js</text></g><g class="chip" style="animation-delay:0.41s"><rect x="259.4" y="226" width="43" height="30" rx="15" fill="#132638" stroke="#24405A"/><text x="281" y="246" text-anchor="middle" fill="#8BA3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">PHP</text></g><g class="chip" style="animation-delay:0.49s"><rect x="312.0" y="226" width="67" height="30" rx="15" fill="#132638" stroke="#24405A"/><text x="346" y="246" text-anchor="middle" fill="#8BA3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">Python</text></g><g class="chip" style="animation-delay:0.57s"><rect x="389.2" y="226" width="59" height="30" rx="15" fill="#132638" stroke="#24405A"/><text x="419" y="246" text-anchor="middle" fill="#8BA3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">Linux</text></g>

  <g class="fade" style="animation-delay:.3s">
    <rect x="690" y="44" width="450" height="254" rx="14" fill="#0D1B2A" stroke="#24405A"/>
    <path d="M690 58a14 14 0 0 1 14-14h422a14 14 0 0 1 14 14v26H690z" fill="#132638"/>
    <line x1="690" y1="84" x2="1140" y2="84" stroke="#24405A"/>
    <circle cx="712" cy="64" r="5.5" fill="#FF5F57"/>
    <circle cx="730" cy="64" r="5.5" fill="#FEBC2E"/>
    <circle cx="748" cy="64" r="5.5" fill="#28C840"/>
    <text x="915.0" y="69" text-anchor="middle" fill="#5E7B94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">~/status · updated 25 Sep 2026</text>
    <text x="718" y="118" fill="#5E7B94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">$</text>
    <text x="736" y="118" fill="#E6EDF3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">whoami</text>
    <circle class="pulse" cx="1110" cy="113" r="4.5" fill="#34D399"/>
    <text x="1098" y="118" text-anchor="end" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">online</text>
  </g>
  <g class="line" style="animation-delay:0.53s"><text x="718" y="152" fill="#5E7B94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">building</text><text x="830" y="152" fill="#E6EDF3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">devprofile.dev</text></g><g class="line" style="animation-delay:0.71s"><text x="718" y="182" fill="#5E7B94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">learning</text><text x="830" y="182" fill="#E6EDF3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">microservices</text></g><g class="line" style="animation-delay:0.89s"><text x="718" y="212" fill="#5E7B94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">shipping</text><text x="830" y="212" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">proxy-scraper v1.4.0</text></g><g class="line" style="animation-delay:1.07s"><text x="718" y="242" fill="#5E7B94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">live list</text><text x="830" y="242" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">907 verified proxies</text></g><g class="line" style="animation-delay:1.25s"><text x="718" y="272" fill="#5E7B94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">github</text><text x="830" y="272" fill="#E6EDF3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">6 public repos · 17 followers</text></g>
  <rect class="cursor" x="718" y="288" width="9" height="18" fill="#38BDF8"/>
</svg>
