<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Maximilian Feix — backend, infrastructure, automation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1725"/>
      <stop offset="55%" stop-color="#0D1B2A"/>
      <stop offset="100%" stop-color="#122A3F"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#2A4258" stroke-width="1" stroke-opacity="0.35"/>
    </pattern>
    <clipPath id="round">
      <rect x="0" y="0" width="1200" height="280" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="280" fill="url(#bg)"/>
    <rect width="1200" height="280" fill="url(#grid)"/>
    <rect x="0" y="278" width="1200" height="2" fill="url(#rule)"/>

    <!-- type block -->
    <text x="72" y="108" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-1.5" fill="#E6EDF3">Maximilian Feix</text>
    <rect x="72" y="126" width="96" height="3" rx="1.5" fill="#38BDF8"/>
    <text x="72" y="168" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Consolas, monospace" font-size="19" fill="#8BA3B8">backend / infrastructure / automation</text>
    <text x="72" y="206" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Consolas, monospace" font-size="15" fill="#5E7B94">building and keeping things online, from Germany</text>

    <!-- rack -->
    <g transform="translate(812, 44)">
      <rect x="-14" y="-12" width="348" height="216" rx="12" fill="#0A1521" stroke="#24405A" stroke-width="1"/>

      <g>
        <rect x="0" y="0" width="320" height="42" rx="7" fill="#152A3D" stroke="#24405A"/>
        <circle cx="24" cy="21" r="5" fill="#34D399">
          <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <text x="46" y="26" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#8BA3B8">web</text>
        <g fill="#24405A">
          <rect x="238" y="14" width="60" height="3" rx="1.5"/>
          <rect x="238" y="21" width="60" height="3" rx="1.5"/>
          <rect x="238" y="28" width="60" height="3" rx="1.5"/>
        </g>
      </g>

      <g transform="translate(0,52)">
        <rect x="0" y="0" width="320" height="42" rx="7" fill="#152A3D" stroke="#24405A"/>
        <circle cx="24" cy="21" r="5" fill="#34D399">
          <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
        </circle>
        <text x="46" y="26" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#8BA3B8">api</text>
        <g fill="#24405A">
          <rect x="238" y="14" width="60" height="3" rx="1.5"/>
          <rect x="238" y="21" width="60" height="3" rx="1.5"/>
          <rect x="238" y="28" width="60" height="3" rx="1.5"/>
        </g>
      </g>

      <g transform="translate(0,104)">
        <rect x="0" y="0" width="320" height="42" rx="7" fill="#152A3D" stroke="#24405A"/>
        <circle cx="24" cy="21" r="5" fill="#38BDF8">
          <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
        </circle>
        <text x="46" y="26" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#8BA3B8">db</text>
        <g fill="#24405A">
          <rect x="238" y="14" width="60" height="3" rx="1.5"/>
          <rect x="238" y="21" width="60" height="3" rx="1.5"/>
          <rect x="238" y="28" width="60" height="3" rx="1.5"/>
        </g>
      </g>

      <g transform="translate(0,156)">
        <rect x="0" y="0" width="320" height="34" rx="7" fill="#0F2233" stroke="#24405A"/>
        <text x="24" y="22" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#5E7B94">cache · queue · cron</text>
      </g>
    </g>
  </g>
</svg>
