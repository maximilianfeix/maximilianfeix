<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-label="RepoAtlas: Map any TypeScript repo in one HTML file. Every connection links to its source line.">
  <style>
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(1.8); } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6F9FC"/><stop offset="1" stop-color="#EAF2F8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.95" cy="0" r="0.7">
      <stop offset="0" stop-color="#6D55C9" stop-opacity=".18"/><stop offset="1" stop-color="#6D55C9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#DCE7F0" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect x=".5" y=".5" width="599" height="299" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="600" height="300" fill="url(#bg)"/>
    <rect width="600" height="300" fill="url(#grid)" opacity=".45"/>
    <rect width="600" height="300" fill="url(#glow)"/>
    <rect width="600" height="4" fill="#6D55C9"/>
  </g>
  <rect x=".5" y=".5" width="599" height="299" rx="16" fill="none" stroke="#D3E1EC"/>
  <g transform="translate(32 30) scale(.75)" fill="none" stroke-width="2.5"><rect x="2" y="2" width="60" height="60" rx="16" fill="#FFFFFF" stroke="#D3E1EC" stroke-width="1.5"/><path d="M26 19h7v13h7M26 45h7V32" stroke="#047857"/><rect x="13.5" y="13" width="12.5" height="12.5" rx="2.5" stroke="#047857"/><rect x="13.5" y="38.5" width="12.5" height="12.5" rx="2.5" stroke="#047857"/><rect x="40" y="25.75" width="12.5" height="12.5" rx="2.5" stroke="#6D55C9"/><circle cx="33" cy="32" r="2.5" fill="#10243A" stroke="none"/></g>
  <text x="92" y="66" fill="#10243A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="-.6">RepoAtlas</text>
  <text x="568" y="62" text-anchor="end" fill="#6D55C9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">interactive demo  →</text>
  <text x="32" y="112" fill="#43647E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17">Map any TypeScript repo in one HTML file.</text><text x="32" y="136" fill="#43647E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17">Every connection links to its source line.</text>
  <rect x="32" y="164" width="172" height="62" rx="10" fill="#FFFFFF" stroke="#D3E1EC"/><text x="48" y="193" fill="#047857" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700">1 file</text><text x="48" y="214" fill="#6B879E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">offline, shareable</text><rect x="218" y="164" width="172" height="62" rx="10" fill="#FFFFFF" stroke="#D3E1EC"/><text x="234" y="193" fill="#10243A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700">0</text><text x="234" y="214" fill="#6B879E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">installs · runs via npx</text><rect x="404" y="164" width="172" height="62" rx="10" fill="#FFFFFF" stroke="#D3E1EC"/><text x="420" y="193" fill="#10243A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700">v0.1.0</text><text x="420" y="214" fill="#6B879E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">release · 1★</text>
  <rect x="32" y="250" width="90" height="26" rx="13" fill="#FFFFFF" stroke="#D3E1EC"/><text x="77" y="267" text-anchor="middle" fill="#43647E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">TypeScript</text><rect x="130.0" y="250" width="105" height="26" rx="13" fill="#FFFFFF" stroke="#D3E1EC"/><text x="182" y="267" text-anchor="middle" fill="#43647E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Compiler API</text><rect x="242.8" y="250" width="68" height="26" rx="13" fill="#FFFFFF" stroke="#D3E1EC"/><text x="277" y="267" text-anchor="middle" fill="#43647E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Actions</text>
</svg>
