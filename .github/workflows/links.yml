name: Link check

on:
  schedule:
    - cron: "12 6 * * 1"   # Mondays
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["README.md"]

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check links in the README
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --accept 200,204,206,429
            --exclude "^https://github.com/.*/(stargazers|pulls\\?)"
            README.md
          fail: true
