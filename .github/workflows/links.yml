name: Link check

on:
  schedule:
    - cron: "12 6 * * 1"   # Mondays
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["README.md"]

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check links in the README
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          # npmjs.com answers bots with 403; the npm package is checked by the profile workflow instead
          args: >-
            --no-progress
            --max-retries 3
            --accept 200,204,206,429
            --exclude "^https://github.com/.*/(stargazers|pulls\\?)"
            --exclude "^https://www.npmjs.com/"
            README.md
          fail: true
