name: Profile

on:
  schedule:
    # every 3 hours, off the full hour
    - cron: "23 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/profile.yml"]

permissions: {}

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt

      - name: Build banner, cards, activity panel, badges and download figures
        run: python3 scripts/build_profile.py >> "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXCLUDE_OWNERS: ${{ vars.PROFILE_EXCLUDE_OWNERS }}

      - name: Commit if something changed
        run: |
          # staged, so new files (a badge for a figure that appears for the first time) count too
          git add -A assets/header-*.svg assets/activity-*.svg assets/card-*.svg README.md data/
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update profile figures"
          git pull --rebase   # another push may have landed while this job ran
          git push
