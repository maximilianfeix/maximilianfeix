name: Contribution snake

on:
  schedule:
    # every night at 02:17 UTC — off the full hour, so the runner queue is shorter
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Generate snake animation
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#121113&color_dots=#EBEDF0,#CBDA9B,#9DB85A,#66852A,#3F5A00
            dist/github-snake-dark.svg?color_snake=#EDEBE6&color_dots=#1C1C1F,#3A4722,#687F35,#9DBD54,#D4F77A

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
