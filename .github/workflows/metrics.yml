name: Metrics

on:
  schedule:
    - cron: "42 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Render metrics into assets/metrics.svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          filename: assets/metrics.svg
          user: ${{ github.repository_owner }}

          template: classic
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          config_timezone: Europe/Berlin
          config_animations: no
          extras_css: |
            body, .background { background-color: #0D1B2A !important; }
            h2, .title { color: #38BDF8 !important; }
            h2 { border-bottom-color: #24405A !important; }
            .field, .value, .username, p, span, li, td { color: #E6EDF3 !important; }
            .details, .meta, .light { color: #8BA3B8 !important; }
            text, tspan { fill: #E6EDF3 !important; }
            a { color: #38BDF8 !important; }

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_sections: most-used

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          plugin_lines: no
