name: Metrics

on:
  schedule:
    - cron: "42 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Render metrics into assets/metrics.svg
        uses: lowlighter/metrics@latest
        with:
          # Classic PAT with the "public_repo" scope, stored as a repository secret.
          token: ${{ secrets.METRICS_TOKEN }}
          # Auto-generated token, only used to commit the result back into this repo.
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          filename: assets/metrics.svg
          user: ${{ github.repository_owner }}

          template: classic
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          config_timezone: Europe/Berlin
          config_theme: dark
          config_animations: no

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_sections: most-used

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          plugin_lines: yes
