name: Metrics

on:
  schedule:
    - cron: "42 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Render metrics into assets/metrics.svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          filename: assets/metrics.svg
          user: ${{ github.repository_owner }}

          template: classic
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          config_timezone: Europe/Berlin
          config_animations: no
          extras_css: |
            svg, body, .background { background-color: #141416 !important; }
            svg { border-radius: 12px; }
            h2, .title { color: #C6F36B !important; }
            h2 { border-bottom-color: #2B2B2F !important; }
            .field, .value, .username, p, span, li, td { color: #EDEBE4 !important; }
            .details, .meta, .light { color: #A3A29D !important; }
            text, tspan { fill: #EDEBE4 !important; }
            a { color: #C6F36B !important; }

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_sections: most-used

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year


          plugin_lines: no

      - name: Render project cards into assets/projects.svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          filename: assets/projects.svg
          user: ${{ github.repository_owner }}

          template: classic
          base: ""
          config_animations: no
          config_display: large
          extras_css: |
            svg, body, .background { background-color: #141416 !important; }
            svg { border-radius: 12px; }
            h2, .title { color: #C6F36B !important; }
            h2 { border-bottom-color: #2B2B2F !important; }
            .field, .value, .username, p, span, li, td { color: #EDEBE4 !important; }
            .details, .meta, .light { color: #A3A29D !important; }
            text, tspan { fill: #EDEBE4 !important; }
            a { color: #C6F36B !important; }

          plugin_repositories: yes
          plugin_repositories_featured: AxonPHPCLI, Mini-Laravel, C--Template-fr-Mac, CurrentlyFreeDomains
          plugin_repositories_order: featured
